name: Capture DeckPilot interface
on:
  push:
    branches: ['preview/screenshot-1.6.1']
    paths: ['.github/workflows/capture-preview.yml', 'tests/capture-preview.ps1', 'tools/DeckPilot.Preview/**']
concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Capture the native Windows interface
        id: capture
        shell: powershell
        run: ./tests/capture-preview.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-interface
          path: ${{ steps.capture.outputs.image }}
      - name: Save the screenshot on this preview branch
        env:
          PREVIEW_IMAGE: ${{ steps.capture.outputs.image }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$env:PREVIEW_IMAGE"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Capture unchanged"; exit 0 }
          git commit -m "Save actual DeckPilot Windows capture [skip ci]"
          git push origin HEAD:preview/screenshot-1.6.1

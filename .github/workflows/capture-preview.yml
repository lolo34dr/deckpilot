name: Capture published DeckPilot interface
on:
  push:
    branches: ['preview/screenshot-1.6.1']
    paths: ['.github/workflows/capture-preview.yml', 'tests/capture-preview.ps1', 'tools/DeckPilot.Preview/**']
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Capture the published Windows app
        shell: powershell
        run: ./tests/capture-preview.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeckPilot-1.6.1-screenshot
          path: docs/previews/deckpilot-1.6.1.png
      - name: Save the screenshot on this preview branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/deckpilot-1.6.1.png
          git commit -m "Save actual DeckPilot 1.6.1 Windows capture [skip ci]"
          git push origin HEAD:preview/screenshot-1.6.1

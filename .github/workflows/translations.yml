name: Complete documentation translations
on:
  push:
    branches: [main]
    paths: [README.md, firmware/README.md, .github/release-notes.md, tools/translations/**, .github/workflows/translations.yml]
  workflow_dispatch:
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Publish Windows release]
    types: [completed]
concurrency:
  group: documentation-translations
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  documentation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: /tmp/deckpilot-models
          key: deckpilot-argos-all-v1
          restore-keys: deckpilot-argos-
      - name: Install neural translation runtime
        run: python -m pip install ctranslate2==4.6.0 sentencepiece==0.2.0 sacremoses==0.1.1 subword-nmt==0.3.8
      - name: Snapshot complete documentation and every published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/translations/translate.py prepare
      - name: Translate full README, firmware and all changelogs in 12 languages
        if: ${{ !contains(github.event.head_commit.message, '[translation-format]') }}
        run: python tools/translations/translate.py all
      - name: Normalize translated typography
        run: python tools/translations/translate.py repair
      - name: Publish validated documentation and translated release bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only origin main
          python -c "import pathlib, shutil; p=pathlib.Path('/tmp/deckpilot-translated/docs'); shutil.copytree(p, 'docs', dirs_exist_ok=True) if p.exists() else None"
          python tools/translations/translate.py repair
          python tools/translations/translate.py publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/i18n docs/releases
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update full README and release translations [skip ci]'
          git push origin HEAD:main
      - name: Save translated documents
        if: ${{ !contains(github.event.head_commit.message, '[translation-format]') }}
        uses: actions/upload-artifact@v6
        with:
          name: full-documentation-translations
          path: /tmp/deckpilot-translated
          if-no-files-found: error

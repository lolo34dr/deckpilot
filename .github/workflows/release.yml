name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  firmware-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify firmware protocol without hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/firmware-protocol.cpp -o /tmp/deckpilot-firmware-check
          /tmp/deckpilot-firmware-check
  release:
    needs: firmware-protocol
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify core behavior on Windows
        run: dotnet run --project tests/DeckPilot.Checks -c Release
      - name: Install verified Arduino CLI 1.2.2
        shell: pwsh
        run: ./firmware/tools/install-cli.ps1
      - name: Compile firmware and bundle verified AVRDUDE
        shell: pwsh
        run: ./firmware/tools/build.ps1
      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DeckPilot.Windows/DeckPilot.Windows.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:GITHUB_REF_NAME) { throw "Le tag ne correspond pas à la version de l’application." }
      - name: Build application
        shell: pwsh
        run: |
          dotnet build DeckPilot.sln -c Release -p:RequireFirmwareBundle=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable folder
        run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:PublishSingleFile=false -o artifacts/win-x64
      - name: Publish standalone executable
        run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/standalone
      - name: Build Windows installer
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./installer/build.ps1
      - name: Verify Windows installation, upgrade and uninstall
        shell: powershell
        run: ./tests/windows-installer-smoke.ps1 -Installer artifacts/installer/DeckPilot-Setup.exe
      - name: Verify native update and application picker
        shell: powershell
        run: ./tests/windows-update-smoke.ps1 -Executable artifacts/standalone/DeckPilot.exe
      - name: Save the native interface capture
        uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-interface
          path: artifacts/ui/DeckPilot.png
          if-no-files-found: error
      - name: Package downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/release/DeckPilot-win-x64.zip
          Copy-Item artifacts/installer/DeckPilot-Setup.exe artifacts/release/DeckPilot-Setup.exe
          Copy-Item artifacts/standalone/DeckPilot.exe artifacts/release/DeckPilot.exe
          Copy-Item artifacts/firmware/DeckPilot-firmware.zip artifacts/release/DeckPilot-firmware.zip
          Get-ChildItem artifacts/release -File | Where-Object { $_.Name -in @("DeckPilot-Setup.exe", "DeckPilot.exe", "DeckPilot-win-x64.zip", "DeckPilot-firmware.zip") } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-release-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/release/DeckPilot-Setup.exe artifacts/release/DeckPilot.exe artifacts/release/DeckPilot-win-x64.zip artifacts/release/DeckPilot-firmware.zip artifacts/release/SHA256SUMS.txt --verify-tag --title "DeckPilot $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Repair historical release tag identities

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-tag-identities.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rewrite tagged commits and repoint tags
        shell: bash
        run: |
          git fetch origin --tags
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_NAME" != "github-actions[bot]" ] && [ "$GIT_COMMITTER_NAME" != "github-actions[bot]" ]; then
            export GIT_AUTHOR_NAME="lolo34dr"
            export GIT_AUTHOR_EMAIL="louis.marley.nono@gmail.com"
            export GIT_COMMITTER_NAME="lolo34dr"
            export GIT_COMMITTER_EMAIL="louis.marley.nono@gmail.com"
          fi
          ' --tag-name-filter cat -- --all
          git for-each-ref --format="delete %(refname)" refs/original | git update-ref --stdin
          git push --force origin 'refs/tags/*:refs/tags/*'
      - name: Remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-tag-identities.yml
          git commit -m "Remove one-time release tag identity repair workflow [skip ci]"
          git push origin HEAD:main

name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DeckPilot.sln -c Release
      - run: dotnet run --project tests/DeckPilot.Checks -c Release --no-build
      - run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/win-x64
      - shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/DeckPilot-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeckPilot-win-x64
          path: artifacts/DeckPilot-win-x64.zip
          if-no-files-found: error

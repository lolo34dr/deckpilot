name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify firmware protocol without hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/firmware-protocol.cpp -o /tmp/deckpilot-firmware-check
          /tmp/deckpilot-firmware-check
  build:
    needs: firmware-protocol
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the bundled RNNoise noise suppressor
        shell: pwsh
        run: |
          cmake --version
          ./third-party/RNNoise/build.ps1
      - name: Verify core behavior on Windows
        run: dotnet run --project tests/DeckPilot.Checks -c Release
        env:
          DECKPILOT_REQUIRE_RNNOISE: '1'
      - name: Install verified Arduino CLI 1.2.2
        shell: pwsh
        run: ./firmware/tools/install-cli.ps1
      - name: Compile firmware and bundle verified AVRDUDE
        shell: pwsh
        run: ./firmware/tools/build.ps1
      - run: dotnet build DeckPilot.sln -c Release -p:RequireFirmwareBundle=true -p:RequireNoiseReductionBundle=true
      - run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:RequireNoiseReductionBundle=true -p:PublishSingleFile=false -o artifacts/win-x64
      - name: Publish standalone executable for Windows smoke checks
        run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:RequireNoiseReductionBundle=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/standalone
      - name: Build Windows installer
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./installer/build.ps1
      - name: Verify Windows installation, upgrade and uninstall
        shell: powershell
        run: ./tests/windows-installer-smoke.ps1 -Installer artifacts/installer/DeckPilot-Setup.exe
      - name: Build Atelier installer
        shell: pwsh
        run: ./installer/build-factory.ps1
      - name: Verify Atelier installation, launch, upgrade and uninstall
        shell: powershell
        run: ./tests/windows-factory-installer-smoke.ps1 -Installer artifacts/installer/DeckPilot-Atelier-Setup.exe
      - name: Verify native update and application picker
        shell: powershell
        run: ./tests/windows-update-smoke.ps1 -Executable artifacts/standalone/DeckPilot.exe
      - name: Build the two macropad beta
        if: startsWith(github.ref, 'refs/heads/beta/')
        shell: pwsh
        run: |
          dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:DeckPilotBeta=true -p:InformationalVersion=2.4.7-hybrid-beta.1 -p:RequireFirmwareBundle=true -p:RequireNoiseReductionBundle=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/hybrid-beta-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          DeckPilot — bêta Windows x64 pour deux macropads
          Firmware 1.2.0 inclus, pour les cartes compatibles ATmega32U4 / Leonardo.

          1. Quittez DeckPilot stable depuis son icône près de l’horloge.
          2. Extrayez l’archive et lancez DeckPilot.Beta.exe. Les réglages restent séparés.
          3. Installez le firmware sur chaque carte, une seule branchée à la fois.
          4. Branchez les deux decks. Dans Macropad, activez le mode DeckPilot sur chacun
             et choisissez son profil. Calibrez chaque deck si l’ordre des boutons diffère.
          5. Testez la même touche sur les deux decks avec des actions distinctes,
             les appuis longs, puis le débranchement d’un deck.

          En mode DeckPilot, une touche libre n’envoie aucune touche Windows.
          Désactivez le mode pour rétablir F13–F24. Après avoir quitté la bêta,
          les réglages de test peuvent être effacés en supprimant
          %LOCALAPPDATA%\DeckPilot-Beta.
          Si les cartes n’ont pas de numéro USB unique, gardez-les sur leur prise USB.
          '@ | Set-Content artifacts/hybrid-beta-win-x64/LISEZ-MOI.txt -Encoding utf8
          Compress-Archive -Path artifacts/hybrid-beta-win-x64/* -DestinationPath artifacts/DeckPilot-Deux-Macropads-Beta-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts/DeckPilot-Deux-Macropads-Beta-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeckPilot-Deux-Macropads-Beta-win-x64.zip" | Set-Content artifacts/DeckPilot-Deux-Macropads-Beta-win-x64.zip.sha256 -Encoding ascii
      - name: Upload the two macropad beta
        if: startsWith(github.ref, 'refs/heads/beta/')
        uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-Deux-Macropads-Beta-win-x64
          path: |
            artifacts/DeckPilot-Deux-Macropads-Beta-win-x64.zip
            artifacts/DeckPilot-Deux-Macropads-Beta-win-x64.zip.sha256
          if-no-files-found: error
      - name: Export native preview for design review
        if: always() && startsWith(github.ref, 'refs/heads/design/')
        shell: pwsh
        run: |
          foreach ($name in @('DeckPilot', 'DeckPilot-editor')) {
            if (!(Test-Path "artifacts/ui/$name.png")) { continue }
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes("artifacts/ui/$name.png"))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
              Write-Output ("DECKPILOT_PREVIEW_${name}=" + $encoded.Substring($offset, [Math]::Min(4096, $encoded.Length - $offset)))
            }
          }
      - name: Save the native interface capture
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-interface
          path: artifacts/ui/*.png
          if-no-files-found: error
      - shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/DeckPilot-win-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-win-x64
          path: artifacts/DeckPilot-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-Setup
          path: artifacts/installer/DeckPilot-Setup.exe
          if-no-files-found: error

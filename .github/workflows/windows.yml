name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify firmware protocol without hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/firmware-protocol.cpp -o /tmp/deckpilot-firmware-check
          /tmp/deckpilot-firmware-check
  build:
    needs: firmware-protocol
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install verified Arduino CLI 1.2.2
        shell: pwsh
        run: ./firmware/tools/install-cli.ps1
      - name: Compile firmware and bundle verified AVRDUDE
        shell: pwsh
        run: ./firmware/tools/build.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DeckPilot.sln -c Release -p:RequireFirmwareBundle=true
      - run: dotnet run --project tests/DeckPilot.Checks -c Release --no-build
      - run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:PublishSingleFile=false -o artifacts/win-x64
      - name: Publish standalone executable for Windows smoke checks
        run: dotnet publish src/DeckPilot.Windows -c Release -r win-x64 --self-contained true -p:RequireFirmwareBundle=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/standalone
      - name: Build Windows installer
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./installer/build.ps1
      - name: Verify Windows installation, upgrade and uninstall
        shell: powershell
        run: ./tests/windows-installer-smoke.ps1 -Installer artifacts/installer/DeckPilot-Setup.exe
      - name: Verify native update and application picker
        shell: powershell
        run: ./tests/windows-update-smoke.ps1 -Executable artifacts/standalone/DeckPilot.exe
      - shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/DeckPilot-win-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-win-x64
          path: artifacts/DeckPilot-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: DeckPilot-Setup
          path: artifacts/installer/DeckPilot-Setup.exe
          if-no-files-found: error
